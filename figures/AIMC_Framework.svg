<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="level1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="level2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="level3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Title Header -->
  <rect x="50" y="20" width="700" height="60" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">AI-Integrated Metacognition (AIMC) Framework</text>
  <text x="400" y="68" font-family="Arial, sans-serif" font-size="12" fill="#b3e5fc" text-anchor="middle">Reconceptualizing Metacognition in AI-Augmented Learning Environments</text>

  <!-- Level 3 (Top - Most advanced) -->
  <g transform="translate(50, 100)">
    <rect width="700" height="130" rx="15" fill="url(#level3Grad)" filter="url(#shadow)"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Level 3: Independent Metacognition</text>
    <text x="25" y="55" font-family="Arial, sans-serif" font-size="12" fill="#e1bee7">(Without-AI Transfer)</text>

    <!-- Content boxes -->
    <rect x="20" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Self-regulated learning</text>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">without AI support</text>

    <rect x="240" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="340" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Internalized monitoring</text>
    <text x="340" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">& evaluation skills</text>

    <rect x="460" y="70" width="220" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="570" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Transfer to novel contexts</text>
    <text x="570" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">(Cognitive Dependency Test)</text>

    <!-- Badge -->
    <circle cx="670" cy="30" r="18" fill="#ce93d8"/>
    <text x="670" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a148c" text-anchor="middle">L3</text>
  </g>

  <!-- Arrow from L3 to L2 -->
  <line x1="400" y1="235" x2="400" y2="255" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="250" font-family="Arial, sans-serif" font-size="10" fill="#666">Internalization</text>

  <!-- Level 2 (Middle) -->
  <g transform="translate(50, 260)">
    <rect width="700" height="130" rx="15" fill="url(#level2Grad)" filter="url(#shadow)"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Level 2: Meta-AI Awareness</text>
    <text x="25" y="55" font-family="Arial, sans-serif" font-size="12" fill="#bbdefb">(About-AI Knowledge)</text>

    <!-- Content boxes -->
    <rect x="20" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Understanding AI</text>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">capabilities & limitations</text>

    <rect x="240" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="340" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Evaluating AI output</text>
    <text x="340" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">reliability & accuracy</text>

    <rect x="460" y="70" width="220" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="570" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Knowing when to use/</text>
    <text x="570" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">not use AI assistance</text>

    <!-- Badge -->
    <circle cx="670" cy="30" r="18" fill="#90caf9"/>
    <text x="670" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">L2</text>
  </g>

  <!-- Arrow from L2 to L1 -->
  <line x1="400" y1="395" x2="400" y2="415" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="410" font-family="Arial, sans-serif" font-size="10" fill="#666">Reflection</text>

  <!-- Level 1 (Bottom - Most basic) -->
  <g transform="translate(50, 420)">
    <rect width="700" height="130" rx="15" fill="url(#level1Grad)" filter="url(#shadow)"/>
    <text x="25" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Level 1: AI-Assisted Metacognition</text>
    <text x="25" y="55" font-family="Arial, sans-serif" font-size="12" fill="#c8e6c9">(With-AI Context)</text>

    <!-- Content boxes -->
    <rect x="20" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Prompt engineering</text>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">as planning</text>

    <rect x="240" y="70" width="200" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="340" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Output evaluation</text>
    <text x="340" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">as monitoring</text>

    <rect x="460" y="70" width="220" height="45" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="570" y="90" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Iterative refinement</text>
    <text x="570" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">as self-regulation</text>

    <!-- Badge -->
    <circle cx="670" cy="30" r="18" fill="#a5d6a7"/>
    <text x="670" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">L1</text>
  </g>

  <!-- Key Finding Box -->
  <g transform="translate(50, 560)">
    <rect width="700" height="35" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="350" y="15" font-family="Arial, sans-serif" font-size="11" fill="#e65100" text-anchor="middle" font-weight="bold">⚠ Key Finding: Current evidence primarily assesses Level 1. The Cognitive Dependency Hypothesis</text>
    <text x="350" y="28" font-family="Arial, sans-serif" font-size="11" fill="#e65100" text-anchor="middle">predicts divergent effects at Level 3 (independent metacognition transferable to AI-absent contexts).</text>
  </g>

  <!-- Citation -->
  <text x="400" y="598" font-family="Arial, sans-serif" font-size="9" fill="#9e9e9e" text-anchor="middle">You, H. (2026). Generative AI in Higher Education: A Three-Level Meta-Analysis. © Pennsylvania State University</text>
</svg>
